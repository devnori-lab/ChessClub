<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Chess Club | Play & Compete</title>
  </head>
  <body>
    <main id="ui-container">
      <nav class="navbar">
        <div class="logo">♟️ GBPUAT Chess Club</div>
        <button class="btn-secondary" id="login-btn">Member Login</button>
      </nav>

      <section class="hero">
        <span class="badge">Next-Gen Tabletop Gaming</span>
        <h1>INFINITE <br/><span class="highlight">CALCULATIONS</span></h1>
        <p>Join the university's premier chess community. Challenge players, analyze matches and climb the competitive ladder.</p>
        
        <div class="cta-group">
          <button class="btn-primary" id="play-btn">Play Online Now</button>
          <button class="btn-outline" id="spectate-btn">Spectate Board</button>
        </div>
      </section>

      <footer class="hud-footer">
        <div class="stat"><span class="stat-num">24</span> Active Players</div>
        <div class="stat"><span class="stat-num">152</span> Matches Played</div>
      </footer>
    </main>

    <canvas id="webgl"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
